# Lists the CCC hands to the proxy in state.json (server NetworkPolicyWriter). Not hard-coded in server code.
# The Settings page shows them and may override them. Saving a list unchanged or empty keeps following this
# file, so updates here reach every CCC whose admin did not change the list (xephyguard:bootstrap also drops
# stored copies that equal this file).
version: 1

# Hosts the proxy decrypts with the lab CA, to force udm=14, hide AI summaries and apply path rules.
# Every other host is filtered by SNI only (no decryption, DECISIONS #10). Each entry is one exact host;
# "*.example.com" opts in to every subdomain of example.com. Sign-in, mail and document hosts
# (accounts.google.com, mail.google.com, docs.google.com, login.live.com, ...) are never decrypted,
# even through a wildcard (proxy/xg_netpolicy/domains.py NEVER_INSPECT).
inspect_hosts:
  - google.com
  - www.google.com
  - google.co.uk
  - www.google.co.uk
  - google.ca
  - www.google.ca
  - google.com.au
  - www.google.com.au
  - google.co.in
  - www.google.co.in
  - google.de
  - www.google.de
  - google.fr
  - www.google.fr
  - bing.com
  - www.bing.com
  - huggingface.co
  - duckduckgo.com
  - search.brave.com

# CSS fallback that hides AI summary boxes on inspected search pages (udm=14 is the primary mechanism).
# Check against the current markup: eval/live_checks/google_ai_overview.py
google_hide_selectors:
  - 'div[jsname="txosbe"]'
  - 'div[data-attrid="AIOverview"]'
  - '#m-x-content'
  - g-ai-overview

# AI-endpoint signatures the proxy acts on (proxy Step 14, I-PROXY-21). Not settings: the CCC sends them
# unchanged in state.json `google` as search_hosts / ai_paths / css_hosts. Until it does, the proxy uses the
# same values built in (proxy/xg_netpolicy/proxy_logic.py SEARCH_AI_DEFAULTS; a test keeps both equal).
# Google search hosts, as regexes on the lower-case host: udm=14 rewrite, the AI paths below, CSS hiding.
google_search_hosts:
  - '^(?:www\.|encrypted\.)?google\.[a-z]{2,6}(?:\.[a-z]{2})?$'
# Path prefixes on those hosts answered 204 (the AI Overview stream); the query string is ignored.
google_ai_paths:
  - /async/folwr
# Other inspected hosts whose pages get the google_hide_selectors CSS (host ends with the entry).
search_css_hosts:
  - bing.com
