# Workspace-local proxy_only stack: uses Docker named volumes (no /var/lib/xephyguard writes, no sudo)
# and renders Unbound listener config from XG_CCC_IP + 127.0.0.1.
name: xephyguard-local

x-app: &app
  image: xephyguard/ccc-app:local
  build: { context: .., dockerfile: ccc-deploy/docker/app.Dockerfile, network: host }
  network_mode: host
  env_file: .env.local
  environment:
    DB_ROOT_PASSWORD: ""   # in .env.local for mysql and bootstrap-local.sh only; no app container uses root (I-CCC-13)
  restart: unless-stopped
  volumes:
    - xg_local_ca:/var/lib/xephyguard/ca
    - xg_local_net:/var/lib/xephyguard/net
    - xg_local_storage:/var/www/html/storage/app
    - ../server/storage/app/public/downloads:/var/www/html/storage/app/public/downloads:ro
    - xg_local_logs:/var/www/html/storage/logs
  depends_on:
    mysql: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }   # schema first, for every app role (I-CCC-24)

services:
  migrate:    # one-shot: the only place migrations run (bootstrap-local.sh starts it through compose)
    <<: *app
    command: ["artisan", "migrate", "--force"]
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }

  mysql:
    image: mysql:8.4.13@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
    network_mode: host
    restart: unless-stopped
    command: ["--bind-address=127.0.0.1", "--port=3306", "--mysqlx=OFF", "--innodb-buffer-pool-size=512M", "--default-time-zone=${DB_TIMEZONE:-+00:00}"]
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
      MYSQL_DATABASE: xephyguard
      MYSQL_USER: xephyguard
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - xg_local_mysql:/var/lib/mysql
    healthcheck:
      # The password comes from the container's own env inside its shell: not in argv or docker inspect (I-CCC-20).
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      retries: 30

  web:
    <<: *app
    command: ["web"]
    volumes:
      - xg_local_ca:/var/lib/xephyguard/ca
      - xg_local_net:/var/lib/xephyguard/net
      - xg_local_storage:/var/www/html/storage/app
      - ../server/storage/app/public/downloads:/var/www/html/storage/app/public/downloads:ro
      - xg_local_logs:/var/www/html/storage/logs
      - xg_local_proxy_logs:/var/www/html/storage/logs/proxy:ro   # proxy-stats.json for /health (S-63)
      - ./nginx/xephyguard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/xg-php.conf:/etc/nginx/xg-php.conf:ro

  reverb:
    <<: *app
    command: ["reverb"]

  worker:
    <<: *app
    command: ["worker"]

  scheduler:
    <<: *app
    command: ["scheduler"]

  netpolicy:
    image: xephyguard/ccc-netpolicy:local
    build: { context: .., dockerfile: ccc-deploy/docker/netpolicy.Dockerfile, network: host }
    network_mode: host
    cap_add: [NET_ADMIN]
    restart: unless-stopped
    environment:   # no env_file: DNS and nft need no secret (I-CCC-13)
      XG_CCC_IP: ${XG_CCC_IP:-}
      XG_NETWORK_MODE: ${XG_NETWORK_MODE:-proxy_only}
    volumes:
      - xg_local_net:/var/lib/xephyguard/net
      - ./docker/unbound-local.conf:/etc/unbound/unbound-local.conf.tmpl:ro

  proxy:
    image: xephyguard/ccc-proxy:local
    build: { context: .., dockerfile: ccc-deploy/docker/proxy.Dockerfile, network: host }
    network_mode: host
    # The entrypoints run as root only to chown, read the 0640 state.json and gosu to uid 1500: just those
    # capabilities (I-CCC-30). No read_only: the mitmproxy image's own entrypoint runs usermod on /etc/passwd.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    dns:   # Unbound only: a public fallback would send every lab lookup out when Unbound fails (I-CCC-28)
      - 127.0.0.1
      - ${XG_DNS_FALLBACK:-127.0.0.1}   # opt in to a fallback resolver by setting it in .env.local
    restart: unless-stopped
    environment:   # as production: no env_file, so no DB password, APP_KEY or screen secret (I-CCC-13)
      XG_NETWORK_MODE: ${XG_NETWORK_MODE:-proxy_only}
      XG_CCC_IP: ${XG_CCC_IP:-}
      XG_INTERNAL_TOKEN: ${XG_INTERNAL_TOKEN}   # bearer for /api/internal/net-events (I-PROXY-13)
      XG_RETENTION_RAW_DAYS: ${XG_RETENTION_RAW_DAYS:-140}
    volumes:
      - xg_local_net:/var/lib/xephyguard/net:ro
      - xg_local_mitmproxy:/home/mitmproxy/.mitmproxy
      - xg_local_proxy_logs:/var/log/xephyguard

  analysis:
    image: xephyguard/ccc-analysis:local
    build: { context: .., dockerfile: ccc-deploy/docker/analysis.Dockerfile, network: host }
    network_mode: host
    restart: unless-stopped
    environment:
      XG_ANALYSIS_BIND: 127.0.0.1   # 127.0.0.1:8090 only (host networking, I-CCC-18)
      XG_DB_URL: mysql://xephyguard:${DB_PASSWORD}@127.0.0.1:3306/xephyguard
      XG_ANALYSIS_TOKEN: ${XG_ANALYSIS_TOKEN}   # its own secret; never the proxy's XG_INTERNAL_TOKEN
      XG_SCORING_V2: ${XG_SCORING_V2:-0}
    depends_on:
      mysql: { condition: service_healthy }

  discovery:
    image: xephyguard/ccc-discovery:local
    build: { context: .., dockerfile: ccc-deploy/docker/discovery.Dockerfile, network: host }
    network_mode: host
    # Runs as nobody and writes no files: no capabilities, no privilege gain, read-only root (I-CCC-30).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    environment:   # only what the reply carries (I-CCC-13)
      XG_CCC_IP: ${XG_CCC_IP:-}
      XG_LAB_NAME: ${XG_LAB_NAME:-}
    volumes:
      - xg_local_ca:/var/lib/xephyguard/ca:ro

  screen-gateway:
    image: xephyguard/ccc-screen-gateway:local
    build: { context: .., dockerfile: ccc-deploy/docker/screen-gateway.Dockerfile, network: host }
    network_mode: host
    # Runs as nobody and writes no files: no capabilities, no privilege gain, read-only root (I-CCC-30).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    # Same as production: -addr is a flag so a .env.local SCREEN_GATEWAY_ADDR cannot widen the bind (I-CCC-1);
    # -trusted-proxy: nginx (same host) passes the verified agent cert from :8443/screen-gw/agent.
    command: ["/usr/local/bin/xephyguard-screen-gateway", "-addr", "127.0.0.1:8082", "-trusted-proxy", "127.0.0.1"]
    # As production: no env_file, so only its own settings and never SCREEN_GATEWAY_DEV_INSECURE (I-CCC-13).
    environment:
      SCREEN_GATEWAY_SECRET: ${SCREEN_GATEWAY_SECRET}
      SCREEN_GATEWAY_INTERNAL_TOKEN: ${XG_INTERNAL_TOKEN}  # agent cert -> PC lookup on 127.0.0.1:8000
      SCREEN_GATEWAY_ISSUER: ${SCREEN_GATEWAY_ISSUER:-xephyguard-ccc}
      SCREEN_GATEWAY_AUDIENCE: ${SCREEN_GATEWAY_AUDIENCE:-xephyguard-gateway}

volumes:
  xg_local_mysql:
  xg_local_ca:
  xg_local_net:
  xg_local_storage:
  xg_local_mitmproxy:
  xg_local_logs:
  xg_local_proxy_logs:
