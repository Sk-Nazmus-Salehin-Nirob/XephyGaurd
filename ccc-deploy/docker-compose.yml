# XephyGuard CCC stack. Started by install.sh (do not run before it has written .env and the CA).
#
# All services use host networking:
#   * the gateway/proxy/DNS layers must see real lab-PC source addresses (per-PC policy),
#   * Docker's own iptables rules are disabled (install.sh) so they cannot interfere with nftables.
# Internal services bind to 127.0.0.1 only; nginx is the single entry point for the LAN.
name: xephyguard

x-app: &app
  image: xephyguard/ccc-app:${XG_VERSION:-latest}
  build: { context: .., dockerfile: ccc-deploy/docker/app.Dockerfile }
  network_mode: host
  env_file: .env
  environment:
    DB_ROOT_PASSWORD: ""   # in .env for mysql and install.sh only; no app container uses root (I-CCC-13)
  restart: unless-stopped
  volumes:
    - /var/lib/xephyguard/ca:/var/lib/xephyguard/ca
    - /var/lib/xephyguard/net:/var/lib/xephyguard/net
    - /var/lib/xephyguard/storage:/var/www/html/storage/app
    - /var/log/xephyguard:/var/www/html/storage/logs
  depends_on:
    mysql: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }   # schema first, for every app role (I-CCC-24)

services:
  migrate:    # one-shot: the only place migrations run (install.sh and update start it through compose)
    <<: *app
    command: ["artisan", "migrate", "--force"]
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }

  mysql:
    image: mysql:8.4.13@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
    network_mode: host
    restart: unless-stopped
    command: ["--bind-address=127.0.0.1", "--port=3306", "--mysqlx=OFF", "--innodb-buffer-pool-size=512M"]
    environment:
      MYSQL_DATABASE: xephyguard
      MYSQL_USER: xephyguard
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [ "/var/lib/xephyguard/mysql:/var/lib/mysql" ]
    healthcheck:
      # The password comes from the container's own env inside its shell: not in argv or docker inspect (I-CCC-20).
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      retries: 30

  web:        # nginx + php-fpm: dashboard (443), agent endpoint (8443, mTLS), CA/installers (80)
    <<: *app
    command: ["web"]
    volumes:
      - /var/lib/xephyguard/ca:/var/lib/xephyguard/ca
      - /var/lib/xephyguard/net:/var/lib/xephyguard/net
      - /var/lib/xephyguard/storage:/var/www/html/storage/app
      - /var/log/xephyguard:/var/www/html/storage/logs   # incl. proxy/proxy-stats.json for /health (S-63)
      - ./nginx/xephyguard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/xg-php.conf:/etc/nginx/xg-php.conf:ro

  reverb:     # WebSocket server (127.0.0.1:8081, reached through nginx /app)
    <<: *app
    command: ["reverb"]

  worker:     # queue: scoring, reports, retention
    <<: *app
    command: ["worker"]

  scheduler:  # timetable, machine-silent detection, purge
    <<: *app
    command: ["scheduler"]

  netpolicy:  # Unbound (DNS sinkhole with per-PC views) + nftables set updates
    image: xephyguard/ccc-netpolicy:${XG_VERSION:-latest}
    build: { context: .., dockerfile: ccc-deploy/docker/netpolicy.Dockerfile }
    network_mode: host
    cap_add: [NET_ADMIN]
    restart: unless-stopped
    environment:
      XG_CCC_IP: ${XG_CCC_IP:-}   # Unbound listens here and on 127.0.0.1 only (I-CCC-4)
    volumes: [ "/var/lib/xephyguard/net:/var/lib/xephyguard/net" ]

  proxy:      # mitmproxy with the XephyGuard addon (SNI filter + selective inspection; transparent or regular by mode)
    image: xephyguard/ccc-proxy:${XG_VERSION:-latest}
    build: { context: .., dockerfile: ccc-deploy/docker/proxy.Dockerfile }
    network_mode: host
    # The entrypoints run as root only to chown, read the 0640 state.json and gosu to uid 1500: just those
    # capabilities (I-CCC-30). No read_only: the mitmproxy image's own entrypoint runs usermod on /etc/passwd.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    dns:   # Unbound only: a public fallback would send every lab lookup out when Unbound fails (I-CCC-28)
      - 127.0.0.1
      - ${XG_DNS_FALLBACK:-127.0.0.1}   # opt in to a fallback resolver by setting it in .env
    restart: unless-stopped
    environment:
      XG_NETWORK_MODE: ${XG_NETWORK_MODE:-gateway}   # default only: network_mode in state.json wins (I-CCC-9)
      XG_CCC_IP: ${XG_CCC_IP:-}   # mitmproxy listens on this lab-side address only (I-CCC-4)
      XG_INTERNAL_TOKEN: ${XG_INTERNAL_TOKEN}   # bearer for /api/internal/net-events; not in proxy.json (I-PROXY-13)
      XG_RETENTION_RAW_DAYS: ${XG_RETENTION_RAW_DAYS:-140}   # purge age of the event spill file (ETHICS.md raw events)
    volumes:
      - /var/lib/xephyguard/net:/var/lib/xephyguard/net:ro
      - /var/lib/xephyguard/mitmproxy:/home/mitmproxy/.mitmproxy      # owned by uid 1500 (install.sh)
      - /var/log/xephyguard/proxy:/var/log/xephyguard

  analysis:   # behavioral scoring service, 127.0.0.1:8090 only (XG_ANALYSIS_BIND; host networking, I-CCC-18)
    image: xephyguard/ccc-analysis:${XG_VERSION:-latest}
    build: { context: .., dockerfile: ccc-deploy/docker/analysis.Dockerfile }
    network_mode: host
    restart: unless-stopped
    environment:
      XG_ANALYSIS_BIND: 127.0.0.1   # the CCC calls http://127.0.0.1:8090; never the LAN
      XG_DB_URL: mysql://xephyguard:${DB_PASSWORD}@127.0.0.1:3306/xephyguard
      XG_ANALYSIS_TOKEN: ${XG_ANALYSIS_TOKEN}   # its own secret; never the proxy's XG_INTERNAL_TOKEN
      XG_SCORING_V2: ${XG_SCORING_V2:-0}
    depends_on:
      mysql: { condition: service_healthy }

  discovery:  # answers agent auto-discovery broadcasts (UDP 47474)
    image: xephyguard/ccc-discovery:${XG_VERSION:-latest}
    build: { context: .., dockerfile: ccc-deploy/docker/discovery.Dockerfile }
    network_mode: host
    # Runs as nobody and writes no files: no capabilities, no privilege gain, read-only root (I-CCC-30).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    environment:   # only what the reply carries; no env_file, so no secret reaches this LAN-facing UDP service (I-CCC-13)
      XG_CCC_IP: ${XG_CCC_IP:-}
      XG_LAB_NAME: ${XG_LAB_NAME:-}
    volumes: [ "/var/lib/xephyguard/ca:/var/lib/xephyguard/ca:ro" ]

  screen-gateway:  # screen WebSocket relay (127.0.0.1:8082 only; LAN reaches it through nginx /screen-gw/)
    image: xephyguard/ccc-screen-gateway:${XG_VERSION:-latest}
    build: { context: .., dockerfile: ccc-deploy/docker/screen-gateway.Dockerfile }
    network_mode: host
    # Runs as nobody and writes no files: no capabilities, no privilege gain, read-only root (I-CCC-30).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    # -addr is a flag so a .env SCREEN_GATEWAY_ADDR cannot widen the bind; no env_file, so it gets
    # only its own settings and never SCREEN_GATEWAY_DEV_INSECURE. An empty secret or internal token makes it exit.
    # The internal token lets it look up an agent cert's PC on nginx 127.0.0.1:8000 (default -server-url).
    # -trusted-proxy: nginx (same host) passes the verified agent cert from :8443/screen-gw/agent.
    command: ["/usr/local/bin/xephyguard-screen-gateway", "-addr", "127.0.0.1:8082", "-trusted-proxy", "127.0.0.1"]
    environment:
      SCREEN_GATEWAY_SECRET: ${SCREEN_GATEWAY_SECRET}
      SCREEN_GATEWAY_INTERNAL_TOKEN: ${XG_INTERNAL_TOKEN}
      SCREEN_GATEWAY_ISSUER: ${SCREEN_GATEWAY_ISSUER:-xephyguard-ccc}
      SCREEN_GATEWAY_AUDIENCE: ${SCREEN_GATEWAY_AUDIENCE:-xephyguard-gateway}
