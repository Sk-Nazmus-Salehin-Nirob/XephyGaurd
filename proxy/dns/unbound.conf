# XephyGuard CCC resolver. The generated file adds per-client views and block zones.
server:
# netpolicy-run replaces the next line with "interface: <XG_CCC_IP>" and "interface: 127.0.0.1" (never 0.0.0.0, I-CCC-4).
__INTERFACE_LINES__
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 refuse
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    cache-min-ttl: 30
    # The Firefox DoH canary (use-application-dns.net) is in the always-blocked "doh" list.
    # Chrome/Edge "secure DNS" is disabled by managed browser policy (installers/browser-policies).
    verbosity: 1
    log-queries: no
    include: /var/lib/xephyguard/net/unbound-xephyguard.conf

# Control only over a unix socket inside the netpolicy container (I-PROXY-2). No TCP listener, so
# other host-network containers (mitmproxy) cannot reach it; Unbound creates the socket 0660 and the
# directory is 0750 root in the container's own /run (not a shared volume). No keys are needed.
remote-control:
    control-enable: yes
    control-use-cert: no
    control-interface: /run/xephyguard-unbound/unbound.ctl
